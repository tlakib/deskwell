name: Microsoft Store package

# Builds an MSIX for upload to Microsoft Partner Center. The Store signs it after certification,
# which is what lets DeskWell run on PCs with Smart App Control turned on.
# Set these repository variables first (Settings > Secrets and variables > Actions > Variables),
# copied from Partner Center > your app > Product identity:
#   MSIX_IDENTITY_NAME   e.g. 12345MdAshikAli.DeskWell
#   MSIX_PUBLISHER       e.g. CN=1A2B3C4D-....
#   MSIX_PUBLISHER_NAME  e.g. Md Ashik Ali
on:
  workflow_dispatch:

jobs:
  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build app (no installer)
        working-directory: apps/desktop
        run: pnpm tauri build --no-bundle
      - name: Pack MSIX
        shell: pwsh
        env:
          ID_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          PUBLISHER_NAME: ${{ vars.MSIX_PUBLISHER_NAME }}
        run: |
          if (-not $env:ID_NAME -or -not $env:PUBLISHER) { throw "Set the MSIX_IDENTITY_NAME and MSIX_PUBLISHER repository variables from Partner Center first." }
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version + ".0"
          $stage = "msix-stage"
          New-Item -ItemType Directory $stage | Out-Null
          Copy-Item apps/desktop/src-tauri/target/release/deskwell.exe $stage
          Copy-Item packaging/msix/Assets $stage -Recurse
          (Get-Content packaging/msix/AppxManifest.template.xml -Raw).
            Replace("__IDENTITY_NAME__", $env:ID_NAME).
            Replace("__PUBLISHER__", $env:PUBLISHER).
            Replace("__PUBLISHER_DISPLAY_NAME__", ($env:PUBLISHER_NAME ? $env:PUBLISHER_NAME : "Md Ashik Ali")).
            Replace("__VERSION__", $version) | Set-Content "$stage/AppxManifest.xml" -Encoding utf8
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName | Select-Object -Last 1
          & $makeappx.FullName pack /d $stage /p "DeskWell_${version}_x64.msix" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: deskwell-msix
          path: "*.msix"
